name: Build TuxHorror for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows64-

      - name: Build TuxHorror.exe
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.7f1
          targetPlatform: StandaloneWindows64
          buildMethod: TuxHorrorBuild.BuildWindows
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TuxHorror-Windows-x64
          path: build/StandaloneWindows64/
          if-no-files-found: error
          retention-days: 14
